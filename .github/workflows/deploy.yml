name: Deploy Backend Only

on:
  push:
    branches: ['master']
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 1. 빌드 (프론트엔드 제외)
      - name: Install Dependencies & Build
        run: |
          # 기존 모듈 삭제 (충돌 방지)
          echo "Cleaning previous installs..."
          rm -rf node_modules package-lock.json
          rm -rf backend/node_modules backend/package-lock.json
          rm -rf shared/node_modules shared/package-lock.json

          echo "Installing dependencies..."
          npm install

          echo "Building Shared..."
          cd shared && npm run build && cd ..

          echo "Building Backend..."
          cd backend && npm run build && cd ..

          # ⭐️ 프론트엔드 빌드 단계 삭제됨

      # 2. 운영 폴더로 배포 (백엔드만)
      - name: Deploy to App Directory
        run: |
          echo "Deploying to ~/apps/blue_banker..."
          mkdir -p ~/apps/blue_banker

          rsync -av --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'shared/node_modules' \
            --exclude 'frontend' \
            ./ ~/apps/blue_banker/

      # 3. 의존성 설치
      - name: Install Production Deps
        run: |
          cd ~/apps/blue_banker
          npm install --omit=dev
          cd backend && npm install --omit=dev

      # 4. .env 생성
      - name: Create .env file
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
        run: |
          echo "$DOTENV_CONTENT" > ~/apps/blue_banker/backend/.env
          chmod 600 ~/apps/blue_banker/backend/.env

      # 5. PM2 재시작
      - name: Reload PM2
        run: |
          cd ~/apps/blue_banker
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
